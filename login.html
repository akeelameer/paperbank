<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PaperBank – Sign In</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    body { background: linear-gradient(135deg,#4f46e5 0%,#06b6d4 100%); min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; }
    .auth-card { background:#fff; border-radius:24px; padding:40px 36px; width:100%; max-width:440px; box-shadow:0 24px 80px rgba(0,0,0,.2); }
    .auth-logo { text-align:center; margin-bottom:28px; }
    .auth-logo .logo-icon { width:60px;height:60px;background:linear-gradient(135deg,#4f46e5,#06b6d4);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;margin:0 auto 10px; }
    .auth-logo h1 { font-size:24px;font-weight:800;color:#1e293b; }
    .auth-logo p  { font-size:13px;color:#64748b;font-style:italic; }
    .auth-tabs { display:flex;background:#f0f4ff;border-radius:12px;padding:4px;margin-bottom:24px; }
    .auth-tab  { flex:1;text-align:center;padding:9px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;color:#64748b;transition:.2s; }
    .auth-tab.active { background:#fff;color:#4f46e5;box-shadow:0 2px 8px rgba(79,70,229,.15); }
    .auth-form { display:flex;flex-direction:column;gap:14px; }
    .auth-form label { font-size:12px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:-8px; }
    .auth-form input { padding:11px 14px;border:1.5px solid #e2e8f0;border-radius:10px;font-family:'Poppins',sans-serif;font-size:14px;outline:none;transition:.2s;background:#f8fafc; }
    .auth-form input:focus { border-color:#4f46e5;background:#fff;box-shadow:0 0 0 3px rgba(79,70,229,.1); }
    .btn-auth { background:linear-gradient(135deg,#4f46e5,#06b6d4);color:#fff;border:none;padding:13px;border-radius:50px;font-family:'Poppins',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:.25s;box-shadow:0 4px 14px rgba(79,70,229,.35);margin-top:4px; }
    .btn-auth:hover { transform:translateY(-2px);box-shadow:0 6px 20px rgba(79,70,229,.45); }
    .divider { display:flex;align-items:center;gap:10px;color:#94a3b8;font-size:13px;margin:4px 0; }
    .divider::before,.divider::after { content:'';flex:1;height:1px;background:#e2e8f0; }
    .social-btns { display:flex;flex-direction:column;gap:10px; }
    .btn-social { display:flex;align-items:center;gap:10px;padding:11px 16px;border:1.5px solid #e2e8f0;border-radius:10px;background:#fff;font-family:'Poppins',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:.2s;color:#1e293b; }
    .btn-social:hover { border-color:#4f46e5;background:#f5f4ff; }
    .btn-social i { font-size:18px;width:22px;text-align:center; }
    .btn-social.google   i { color:#ea4335; }
    .btn-social.github   i { color:#333; }
    .btn-social.facebook i { color:#1877f2; }
    .btn-social.phone    i { color:#10b981; }
    .forgot-link { text-align:right;font-size:12px; }
    .forgot-link a { color:#4f46e5;text-decoration:none;font-weight:500; }
    .forgot-link a:hover { text-decoration:underline; }
    .auth-error { background:#fff1f2;border:1px solid #fecdd3;color:#be123c;padding:10px 14px;border-radius:10px;font-size:13px;display:none; }
    .auth-success { background:#f0fdf4;border:1px solid #bbf7d0;color:#15803d;padding:10px 14px;border-radius:10px;font-size:13px;display:none; }
    /* Phone OTP section */
    #phone-section { display:none;flex-direction:column;gap:14px; }
    .otp-row { display:flex;gap:8px; }
    .otp-row input { flex:1; }
    .btn-send-otp { background:#4f46e5;color:#fff;border:none;padding:11px 16px;border-radius:10px;font-family:'Poppins',sans-serif;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap; }
    .back-link { text-align:center;font-size:13px;color:#64748b;margin-top:8px; }
    .back-link a { color:#4f46e5;font-weight:600;text-decoration:none; }
    .back-link a:hover { text-decoration:underline; }
  </style>
</head>
<body>

<!-- Home button -->
<div style="position:absolute; top:20px; left:20px;">
  <a href="index.html" class="btn-home" style="background:rgba(255,255,255,.2); border:1.5px solid rgba(255,255,255,.4); color:#fff; padding:8px 18px; border-radius:50px; font-family:'Poppins',sans-serif; font-size:14px; font-weight:500; cursor:pointer; transition:.2s; text-decoration:none; display:flex; align-items:center; gap:7px;"><i class="fas fa-home"></i> Home</a>
</div>

<div class="auth-card">
  <!-- Logo -->
  <div class="auth-logo">
    <div class="logo-icon"><i class="fas fa-university"></i></div>
    <h1>PaperBank</h1>
    <p>"Invest in Knowledge"</p>
  </div>

  <!-- Error / Success messages -->
  <div id="auth-error"   class="auth-error"></div>
  <div id="auth-success" class="auth-success"></div>

  <!-- Tabs -->
  <div class="auth-tabs">
    <div class="auth-tab active" id="tab-signin" onclick="switchTab('signin')">Sign In</div>
    <div class="auth-tab"        id="tab-signup" onclick="switchTab('signup')">Sign Up</div>
  </div>

  <!-- ── SIGN IN FORM ── -->
  <div id="form-signin">
    <div class="auth-form">
      <label>Email Address</label>
      <input type="email" id="si-email" placeholder="you@example.com" autocomplete="email"/>
      <label>Password</label>
      <input type="password" id="si-pass" placeholder="••••••••" autocomplete="current-password"/>
      <div class="forgot-link"><a href="#" onclick="showForgot()">Forgot password?</a></div>
      <button class="btn-auth" onclick="doSignIn()"><i class="fas fa-sign-in-alt"></i> Sign In</button>
    </div>

    <div class="divider">or continue with</div>

    <div class="social-btns">
      <button class="btn-social google"   onclick="doGoogle()">  <i class="fab fa-google"></i>   Continue with Google</button>
    </div>
  </div>

  <!-- ── SIGN UP FORM ── -->
  <div id="form-signup" style="display:none;">
    <div class="auth-form">
      <label>Full Name</label>
      <input type="text"     id="su-name"  placeholder="Your full name"/>
      <label>Email Address</label>
      <input type="email"    id="su-email" placeholder="you@example.com" autocomplete="email"/>
      <label>Password</label>
      <input type="password" id="su-pass"  placeholder="Min. 6 characters" autocomplete="new-password"/>
      <label>Confirm Password</label>
      <input type="password" id="su-pass2" placeholder="Repeat password" autocomplete="new-password"/>
      <button class="btn-auth" onclick="doSignUp()"><i class="fas fa-user-plus"></i> Create Account</button>
    </div>

    <div class="divider">or sign up with</div>

    <div class="social-btns">
      <button class="btn-social google"   onclick="doGoogle()">  <i class="fab fa-google"></i>   Sign up with Google</button>
    </div>
  </div>

  <!-- Recaptcha container (invisible) -->
  <div id="recaptcha-container"></div>

  <div class="back-link" style="margin-top:16px;">
    <a href="index.html"><i class="fas fa-arrow-left"></i> Back to PaperBank</a>
  </div>
</div>

<script type="module">
import {
  signUpEmail, signInEmail,
  signInGoogle,
  resetPassword, onUserChange
} from "./firebase-helpers.js";

// Redirect if already logged in
onUserChange((user) => {
  if (user) window.location.href = "index.html";
});

// ── TAB SWITCH ────────────────────────────────────────────
window.switchTab = (tab) => {
  document.getElementById("form-signin").style.display = tab === "signin" ? "" : "none";
  document.getElementById("form-signup").style.display = tab === "signup" ? "" : "none";
  document.getElementById("tab-signin").classList.toggle("active", tab === "signin");
  document.getElementById("tab-signup").classList.toggle("active", tab === "signup");
  clearMessages();
};

// ── MESSAGES ──────────────────────────────────────────────
function showError(msg) {
  const el = document.getElementById("auth-error");
  el.textContent = msg; el.style.display = "";
  document.getElementById("auth-success").style.display = "none";
}
function showSuccess(msg) {
  const el = document.getElementById("auth-success");
  el.textContent = msg; el.style.display = "";
  document.getElementById("auth-error").style.display = "none";
}
function clearMessages() {
  document.getElementById("auth-error").style.display   = "none";
  document.getElementById("auth-success").style.display = "none";
}

// ── SIGN IN ───────────────────────────────────────────────
window.doSignIn = async () => {
  const email = document.getElementById("si-email").value.trim();
  const pass  = document.getElementById("si-pass").value;
  if (!email || !pass) { showError("Please fill in all fields."); return; }
  try {
    await signInEmail(email, pass);
    window.location.href = "index.html";
  } catch(e) { showError(friendlyError(e.code)); }
};

// ── SIGN UP ───────────────────────────────────────────────
window.doSignUp = async () => {
  const name  = document.getElementById("su-name").value.trim();
  const email = document.getElementById("su-email").value.trim();
  const pass  = document.getElementById("su-pass").value;
  const pass2 = document.getElementById("su-pass2").value;
  if (!name || !email || !pass) { showError("Please fill in all fields."); return; }
  if (pass !== pass2)           { showError("Passwords do not match."); return; }
  if (pass.length < 6)          { showError("Password must be at least 6 characters."); return; }
  try {
    await signUpEmail(email, pass, name);
    window.location.href = "index.html";
  } catch(e) { showError(friendlyError(e.code)); }
};

// ── SOCIAL ────────────────────────────────────────────────
window.doGoogle   = async () => { try { await signInGoogle();   window.location.href="index.html"; } catch(e){ showError(friendlyError(e.code)); } };
window.doGithub   = async () => { try { await signInGithub();   window.location.href="index.html"; } catch(e){ showError(friendlyError(e.code)); } };
window.doFacebook = async () => { try { await signInFacebook(); window.location.href="index.html"; } catch(e){ showError(friendlyError(e.code)); } };

// ── PHONE ─────────────────────────────────────────────────
window.showPhone = () => {
  document.getElementById("form-signin").style.display  = "none";
  document.getElementById("form-signup").style.display  = "none";
  document.getElementById("phone-section").style.display = "flex";
  setupRecaptcha("recaptcha-container");
};
window.hidePhone = () => {
  document.getElementById("phone-section").style.display = "none";
  document.getElementById("form-signin").style.display   = "";
};
window.doSendOTP = async () => {
  const num = document.getElementById("ph-number").value.trim();
  if (!num) { showError("Enter a phone number."); return; }
  try {
    await sendOTP(num);
    document.getElementById("otp-row").style.display       = "";
    document.getElementById("btn-verify-otp").style.display = "";
    showSuccess("OTP sent! Check your phone.");
  } catch(e) { showError(friendlyError(e.code)); }
};
window.doVerifyOTP = async () => {
  const otp = document.getElementById("ph-otp").value.trim();
  if (!otp) { showError("Enter the OTP."); return; }
  try {
    await verifyOTP(otp);
    window.location.href = "index.html";
  } catch(e) { showError("Invalid OTP. Please try again."); }
};

// ── FORGOT PASSWORD ───────────────────────────────────────
window.showForgot = async () => {
  const email = document.getElementById("si-email").value.trim();
  if (!email) { showError("Enter your email address first."); return; }
  try {
    await resetPassword(email);
    showSuccess("Password reset email sent! Check your inbox.");
  } catch(e) { showError(friendlyError(e.code)); }
};

// ── FRIENDLY ERROR MESSAGES ───────────────────────────────
function friendlyError(code) {
  const map = {
    "auth/user-not-found":       "No account found with this email.",
    "auth/wrong-password":       "Incorrect password.",
    "auth/email-already-in-use": "This email is already registered.",
    "auth/invalid-email":        "Invalid email address.",
    "auth/weak-password":        "Password is too weak.",
    "auth/popup-closed-by-user": "Sign-in popup was closed.",
    "auth/account-exists-with-different-credential": "An account already exists with this email.",
    "auth/network-request-failed": "Network error. Check your connection.",
  };
  return map[code] || "Something went wrong. Please try again.";
}

// Enter key support
document.getElementById("si-pass").addEventListener("keydown", e => { if(e.key==="Enter") window.doSignIn(); });
document.getElementById("su-pass2").addEventListener("keydown", e => { if(e.key==="Enter") window.doSignUp(); });
</script>
</body>
</html>
