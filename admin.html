<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PaperBank – Admin Panel</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>body{background:var(--bg);}</style>
</head>
<body>
<header class="site-header" style="position:relative;">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon"><i class="fas fa-university"></i></div>
      <div class="logo-text">
        <span class="logo-main">PaperBank</span>
        <span class="logo-sub">Admin Panel</span>
      </div>
    </div>
    <nav class="header-nav">
      <a href="index.html" class="btn-home"><i class="fas fa-arrow-left"></i> Back to Site</a>
    </nav>
  </div>
</header>

<div class="admin-container">
  <div class="admin-header">
    <h1><i class="fas fa-cog"></i> Admin Dashboard</h1>
    <div id="user-info" style="display:flex;align-items:center;gap:10px;">
      <span id="admin-name" style="font-weight:600;"></span>
      <button class="btn-sm" style="background:#fff1f2;color:#e11d48;" onclick="doLogout()"><i class="fas fa-sign-out-alt"></i> Sign Out</button>
    </div>
  </div>

  <div id="access-denied" style="display:none;text-align:center;padding:60px 20px;">
    <i class="fas fa-lock" style="font-size:48px;color:#cbd5e1;margin-bottom:16px;"></i>
    <h2 style="color:var(--text);margin-bottom:8px;">Access Denied</h2>
    <p style="color:var(--text-muted);">Only the owner can access this page.</p>
    <a href="index.html" style="display:inline-block;margin-top:20px;color:var(--primary);font-weight:600;">Go to Home →</a>
  </div>

  <div id="admin-panels" style="display:none;">
    <div class="admin-tabs">
      <div class="admin-tab active" data-tab="users"><i class="fas fa-users"></i> Users</div>
      <div class="admin-tab" data-tab="editors"><i class="fas fa-pen"></i> Editors</div>
      <div class="admin-tab" data-tab="comments"><i class="fas fa-comments"></i> Comments</div>
    </div>
    <div id="panel-users" class="admin-panel active">
      <div class="admin-table"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Joined</th><th>Actions</th></tr></thead><tbody id="users-list"></tbody></table></div>
    </div>
    <div id="panel-editors" class="admin-panel">
      <div class="admin-table"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Actions</th></tr></thead><tbody id="editors-list"></tbody></table></div>
    </div>
    <div id="panel-comments" class="admin-panel">
      <div id="comments-list" class="comments-admin-list"></div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
import{onUserChange,currentRole,logOut,getAllUsers,setUserRole,banUser,deleteUserDoc,getAllComments,deleteComment}from"./firebase-helpers.js";

let _user=null,_role="visitor",allUsers=[],allComments=[];

onUserChange(async(u,r)=>{_user=u;_role=r;if(r!=="owner"){document.getElementById("access-denied").style.display="";document.getElementById("admin-panels").style.display="";return}
document.getElementById("access-denied").style.display="none";document.getElementById("admin-panels").style.display="";document.getElementById("admin-name").textContent=u.displayName||u.email;await loadData()});

async function loadData(){allUsers=await getAllUsers();allComments=await getAllComments();renderUsers();renderEditors();renderComments()}

function renderUsers(){const t=document.getElementById("users-list");t.innerHTML="";allUsers.forEach(u=>{const tr=document.createElement("tr");const rc=u.role||"user";const jn=u.createdAt?new Date(u.createdAt.seconds*1000).toLocaleDateString():"-";tr.innerHTML=`<td>${e(u.displayName||"-")}</td><td>${e(u.email||"-")}</td><td><span class="role-badge role-${rc}">${u.role||"user"}</span></td><td>${jn}</td><td class="admin-actions">${u.role!=="owner"?`<button class="btn-sm btn-sm-promote" data-action="promote" data-uid="${u.uid}"><i class="fas fa-arrow-up"></i> Editor</button><button class="btn-sm btn-sm-ban" data-action="ban" data-uid="${u.uid}"><i class="fas fa-ban"></i> Ban</button><button class="btn-sm btn-sm-delete" data-action="delete" data-uid="${u.uid}"><i class="fas fa-trash"></i></button>`:"<span style='color:#94a3b8;font-size:12px;'>Owner</span>"}</td>`;t.appendChild(tr)})}

function renderEditors(){const t=document.getElementById("editors-list");t.innerHTML="";const ed=allUsers.filter(u=>u.role==="editor");if(ed.length===0){t.innerHTML="<tr><td colspan='4' style='text-align:center;color:#94a3b8;padding:30px;'>No editors yet</td></tr>";return}
ed.forEach(u=>{const tr=document.createElement("tr");tr.innerHTML=`<td>${e(u.displayName||"-")}</td><td>${e(u.email||"-")}</td><td><span class="role-badge role-editor">Editor</span></td><td class="admin-actions"><button class="btn-sm btn-sm-ban" data-action="demote" data-uid="${u.uid}"><i class="fas fa-arrow-down"></i> Demote</button></td>`;t.appendChild(tr)})}

function renderComments(){const l=document.getElementById("comments-list");l.innerHTML="";if(allComments.length===0){l.innerHTML="<div style='text-align:center;color:#94a3b8;padding:40px;'>No comments yet</div>";return}
allComments.forEach(c=>{const it=document.createElement("div");it.className="comment-admin-item";it.innerHTML=`<div class="comment-admin-content"><div class="comment-admin-meta"><strong>${e(c.authorName)}</strong> · ${c.createdAt?new Date(c.createdAt.seconds*1000).toLocaleString():"-"}</div><div class="comment-admin-text">${e(c.text)}</div></div><button class="btn-sm btn-sm-delete" data-action="deletecomment" data-id="${c.id}"><i class="fas fa-trash"></i></button>`;l.appendChild(it)})}

document.querySelectorAll(".admin-tab").forEach(t=>t.addEventListener("click",function(){document.querySelectorAll(".admin-tab").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".admin-panel").forEach(x=>x.classList.remove("active"));this.classList.add("active");document.getElementById("panel-"+this.dataset.tab).classList.add("active")}));

document.addEventListener("click",async e=>{const b=e.target.closest("button[data-action]");if(!b)return;const act=b.dataset.action,id=b.dataset.uid||b.dataset.id;if(act==="promote"){try{await setUserRole(id,"editor");S("Promoted to editor!");await loadData()}catch(x){S(x.message,"error")}}else if(act==="demote"){try{await setUserRole(id,"user");S("Demoted to user");await loadData()}catch(x){S(x.message,"error")}}else if(act==="ban"){if(!confirm("Ban this user?"))return;try{await banUser(id);S("User banned");await loadData()}catch(x){S(x.message,"error")}}else if(act==="delete"){if(!confirm("Delete user permanently?"))return;try{await deleteUserDoc(id);S("User deleted");await loadData()}catch(x){S(x.message,"error")}}else if(act==="deletecomment"){try{await deleteComment(id);S("Comment deleted");await loadData()}catch(x){S(x.message,"error")}}});

function e(s){if(!s)return"";return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function S(m,t){const x=document.getElementById("toast");x.textContent=m;x.className="toast "+(t||"default")+" show";setTimeout(()=>x.classList.remove("show"),3000)}
window.doLogout=async()=>{await logOut();window.location.href="index.html"};
</script>
</body>
</html>
